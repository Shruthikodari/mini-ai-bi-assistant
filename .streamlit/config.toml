[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1E293B"
font = "sans serif"

[client]
# Never show Python tracebacks in the browser (they still go to the console).
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
